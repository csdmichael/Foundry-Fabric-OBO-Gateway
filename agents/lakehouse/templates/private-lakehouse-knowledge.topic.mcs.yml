# Name: Private Lakehouse Knowledge
# Live open-shortage facts retrieved through the private APIM OBO connector under the invoking user's permissions.
# Render this template only after Copilot Studio creates the connector connection reference.
kind: AdaptiveDialog
beginDialog:
  kind: OnKnowledgeRequested
  id: main
  intent: {}
  actions:
    - kind: InvokeConnectorAction
      id: queryLakehouseKnowledge_p7K4mQ
      connectionReference: __CONNECTOR_LOGICAL_NAME__
      connectionProperties:
        kind: ConnectionReferenceBySchema
        connectionReferenceSchemaName: __CONNECTION_REFERENCE_SCHEMA_NAME__
      operationId: knowledge
      input:
        body/query: =System.SearchQuery
      output:
        statusCode: Topic.KnowledgeStatusCode
        body: Topic.KnowledgeResponse

    - kind: SetVariable
      id: setLakehouseKnowledgeResults_v3N8cR
      variable: System.SearchResults
      value: =ForAll(Topic.KnowledgeResponse.results, { Content: ThisRecord.snippet, ContentLocation: ThisRecord.url, Title: ThisRecord.title })

inputType: {}
outputType: {}
