# Name: Fabric Data Agent
# Queries the published parts-shortage Fabric Data Agent through private APIM with end-user OBO.
# Render this template only after Copilot Studio creates the connector connection reference.
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: question
    description: A focused natural-language question about parts shortages, suppliers, demand, inventory, or mitigation.
    entity: StringPrebuiltEntity
    shouldPromptUser: true

modelDisplayName: Fabric Data Agent
modelDescription: Query the governed parts-shortage Fabric Data Agent using the invoking user's permissions.

outputs:
  - propertyName: Response

action:
  kind: InvokeConnectorTaskAction
  connectionReference: __CONNECTOR_LOGICAL_NAME__
  connectionProperties:
    mode: Invoker
  operationId: query

outputMode: All
